<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ShopSphere Smart Shopping Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 460px;
      width: 100%;
      box-shadow: var(--shadow-xl);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .demo-credentials-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 24px;
    }
    .demo-btn {
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: white;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--dark);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .demo-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap input {
      width: 100%;
      padding: 12px 40px 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      font-size: 0.9rem;
      transition: var(--transition);
    }
    .input-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .input-icon-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="container header-inner" style="justify-content:space-between;">
      <a href="/index.html" class="brand-logo">
        <div class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></div>
        <span>Shop<span class="highlight">Sphere</span></span>
      </a>
      <a href="/index.html" style="font-size:0.9rem; font-weight:700; color:var(--text-muted);">
        &larr; Back to Store
      </a>
    </div>
  </header>

  <!-- Auth Main -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--dark); margin-bottom: 6px;">Sign In to ShopSphere</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Welcome back! Enter your credentials to access your account.</p>
      </div>

      <!-- Quick 1-Click Demo Login Box -->
      <div class="demo-credentials-box">
        <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary);"></i> Quick Test Evaluator Logins:
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="button" class="demo-btn" onclick="fillDemoLogin('customer')" style="flex: 1;">
            <i class="fa-solid fa-user"></i> Demo Customer
          </button>
          <button type="button" class="demo-btn" onclick="fillDemoLogin('admin')" style="flex: 1;">
            <i class="fa-solid fa-crown" style="color: #f59e0b;"></i> Demo Admin
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div style="margin-bottom: 18px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main);">Email Address</label>
          <div class="input-wrap">
            <input type="email" id="login-email" required placeholder="you@example.com" autocomplete="email">
          </div>
        </div>

        <div style="margin-bottom: 22px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-main);">Password</label>
            <a href="#" onclick="showToast('For evaluation, please use password123 or admin123', 'info')" style="font-size: 0.8rem; color: var(--primary);">Forgot Password?</a>
          </div>
          <div class="input-wrap">
            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('login-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-brand" style="width: 100%; padding: 13px; font-size: 0.95rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 700;">Create Account</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="main-footer" style="padding: 24px 0;">
    <div class="container footer-bottom" style="border:none; padding:0;">
      <div>&copy; 2026 ShopSphere – CodeAlpha Internship Task 1.</div>
      <div>Full-Stack Web Development</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
